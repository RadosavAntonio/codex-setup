model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "danger-full-access"
personality = "pragmatic"
web_search = "cached"
service_tier = "flex"
project_doc_max_bytes = 65536
approvals_reviewer = "user"

[notice]
hide_full_access_warning = true

[features]
hooks = true
multi_agent = true
shell_snapshot = true
memories = true
prevent_idle_sleep = true

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = false

[history]
persistence = "save-all"

[sandbox_workspace_write]
writable_roots = []
network_access = false
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

[agents]
max_threads = 6
max_depth = 1

[tui]
notifications = true
animations = true
theme = "ansi"
status_line = ["current-dir", "git-branch", "model-with-reasoning", "context-used", "total-input-tokens", "total-output-tokens", "five-hour-limit", "weekly-limit"]

[tui.model_availability_nux]
"gpt-5.5" = 3
"gpt-5.6-sol" = 4

[projects."{{HOME}}"]
trust_level = "trusted"

[projects."{{HOME}}/hl-mobile-app"]
trust_level = "trusted"

[projects."{{HOME}}/antonioR"]
trust_level = "trusted"

[projects."{{HOME}}/courtenayLodge"]
trust_level = "trusted"

[projects."{{HOME}}/antonioTest084"]
trust_level = "trusted"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
