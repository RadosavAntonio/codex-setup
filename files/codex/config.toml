service_tier = "default"
model_reasoning_effort = "high"
check_for_update_on_startup = true
notify = ["{{HOME}}/.codex/hooks/notify-sound.sh"]
model = "gpt-5.6-sol"
default_permissions = ":workspace"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[features]
apps = true
browser_use = true
computer_use = true
goals = true
hooks = true
in_app_browser = true
memories = true
multi_agent = true
plugins = true
remote_plugin = true
artifact = true
default_mode_request_user_input = true
workspace_dependencies = true

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_reasoning_effort = "medium"

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
notification_method = "auto"
notification_condition = "unfocused"
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch"]

[mcp_servers."transcript-search"]
command = "python3"
args = ["{{HOME}}/.codex/transcript-search/rag_lite.py", "serve"]
startup_timeout_sec = 10
tool_timeout_sec = 60
default_tools_approval_mode = "auto"

[mcp_servers."transcript-search".tools.search]
approval_mode = "approve"

[mcp_servers."transcript-search".tools.get_context]
approval_mode = "approve"

[mcp_servers."claude-video-vision"]
command = "npx"
args = ["-y", "claude-video-vision@1.3.2"]
startup_timeout_sec = 30
tool_timeout_sec = 300
default_tools_approval_mode = "writes"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@4.0.2"]
startup_timeout_sec = 30
tool_timeout_sec = 60
default_tools_approval_mode = "auto"

[mcp_servers.XcodeBuildMCP]
command = "npx"
args = ["-y", "xcodebuildmcp@latest", "mcp"]

[mcp_servers.android]
command = "node"
args = ["{{HOME}}/mcp-servers/android-mcp-server/dist/index.js"]
